<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 minimum-scale=1">
		<title>Frontend Mentor - interactive-rating-component-main</title>
		<link rel="icon" type="image/png" sizes="32x32" href="./img/favicon-32x32.png">
		<link rel="stylesheet"  href="style.css">
		

	</head>
	
	
	<body>
		<div class="container">
			<div class="content">
				<div class="isi">
					<div class="gambar">
					<img src="img/star.svg">
					</div>
					<p style="color:white">How did we do ?</p>
					<p class="text">Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</p>
					<div class="rating">
						<div class="nomer">
							<button  class="btn">1</button>
									
							
							<button  class="btn">2</button>

							<button  class="btn">3</button>

							<button  class="btn">4</button>

							<button  class="btn">5</button>

						</div>
					</div>
				</div>
				<button id="submit">SUBMIT</button>				
			</div>

			<!-- content 2 -->

			<div class="content2 hidden">
				<img src="img/thankyou.svg">
				<div class="textselected">
					<p class="selected"style="color:hsl(25, 97%, 53%)">You selected out 
					<span id="rating"></span>	
					of 5</p>	
				</div>
				<h3 style="color:white">Thank you!</h3>
				
				<p>
					We appreciate you taking the time to give a rating. If you ever need more support, don't hesitate to got in touch!
				</p>
			</div>



		</div>
	</body>

	<script type="text/javascript">
		const Content = document.querySelector(".content");
		const Content2 = document.querySelector(".content2");
		const Submit = document.querySelector("#submit");
		const a= document.querySelector("#rating");
		const rates = document.querySelectorAll(".btn");
		


		Submit.addEventListener('click',function(){
			Content2.classList.remove("hidden");
			Content.style.display="none";	
		});

		rates.forEach((rate)=>{
			rate.addEventListener('click',function(){
				// console.log(rate.innerHTML);
				// rate.style.color="white";
				a.innerHTML=rate.innerHTML;
			})
		})


		
	</script>
</html>
